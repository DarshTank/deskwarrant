name: Release agent

# Builds the Windows agent and publishes it to a GitHub Release, which is what
# the console's /download route redirects to. Release assets on a public repo
# are fetchable without authentication, so a new user needs nothing but a
# browser.
#
# One-time setup: add a repository variable CONSOLE_URL (Settings → Secrets and
# variables → Actions → Variables) holding the console's public URL, e.g.
# https://deskwarrant.vercel.app. It is baked into the build so a fresh install
# has nothing to type.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0). Publishes a v-prefixed pre-release."
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v${{ inputs.version }}"
          }
          $version = $tag -replace '^v', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building $tag (version $version)"

      - name: Install dependencies
        working-directory: agent
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Fetch cloudflared
        shell: pwsh
        working-directory: agent
        run: |
          # Bundled into the exe so live view needs no separate install. The
          # spec picks it up from agent\cloudflared.exe.
          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile "cloudflared.exe"
          Write-Host "cloudflared: $((Get-Item cloudflared.exe).Length / 1MB) MB"

      - name: Bake in the console URL
        shell: pwsh
        working-directory: agent
        env:
          CONSOLE_URL: ${{ vars.CONSOLE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CONSOLE_URL)) {
            Write-Error @"
          The CONSOLE_URL repository variable is not set.

          Without it the built agent has no console to talk to and will prompt
          the user for a URL on first run, which defeats the point of shipping
          an installer. Set it under:
            Settings -> Secrets and variables -> Actions -> Variables
          "@
            exit 1
          }
          $url = $env:CONSOLE_URL.TrimEnd('/')
          @"
          # Generated by .github/workflows/release.yml -- do not commit.
          CONSOLE_URL = "$url"
          "@ | Set-Content -Path "_build_config.py" -Encoding utf8
          Write-Host "Console URL: $url"

      - name: Build the agent
        working-directory: agent
        run: python -m PyInstaller deskwarrant.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        working-directory: agent
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            installer.iss

      - name: Checksums
        shell: pwsh
        working-directory: agent
        run: |
          $files = @("dist\DeskWarrantAgent.exe", "Output\DeskWarrantSetup.exe")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content -Path "Output\SHA256SUMS.txt" -Encoding ascii
          Get-Content "Output\SHA256SUMS.txt"

      - name: Publish the release
        shell: pwsh
        working-directory: agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"

          # `gh release create` fails if the release already exists, so check
          # first -- a re-run of the same tag should replace assets, not error.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = @"
          Windows agent ``$tag``.

          **Install:** download ``DeskWarrantSetup.exe`` and run it. Windows will
          warn that the publisher is unknown because the build is unsigned —
          choose **More info -> Run anyway**. The agent then opens your browser
          to approve this PC.

          ``DeskWarrantAgent.exe`` is the same agent without the installer: it
          does not register autostart, so it stops at reboot.
          "@
            gh release create $tag --title "DeskWarrant agent $tag" --notes $notes
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

          gh release upload $tag `
            "Output\DeskWarrantSetup.exe" `
            "dist\DeskWarrantAgent.exe" `
            "Output\SHA256SUMS.txt" `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
