<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 164 314"
  width="164"
  height="314"
  fill="none"
>
  <!--
    The installer's left banner. Inno Setup wants 164x314 at 100% scaling and
    picks larger variants for high-DPI displays, so this is authored at that
    exact aspect and rasterised at several multiples.

    Typeface is a serif stack, not the console's webfont: nothing loads CSS
    here, and Georgia ships with Windows — it is already the declared fallback
    for Instrument Serif in the console, so the two stay recognisably related.
  -->
  <defs>
    <linearGradient id="dw-panel" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#16161A" />
      <stop offset="55%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#08080B" />
    </linearGradient>

    <radialGradient id="dw-panel-wash" cx="50%" cy="27%" r="62%">
      <stop offset="0%" stop-color="#62D4B0" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#62D4B0" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="dw-panel-signal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="35%" stop-color="#62D4B0" />
      <stop offset="100%" stop-color="#1D6B57" />
    </linearGradient>
  </defs>

  <rect width="164" height="314" fill="url(#dw-panel)" />
  <rect width="164" height="314" fill="url(#dw-panel-wash)" />

  <!-- Seal, simplified to the silhouette that reads at this size -->
  <g transform="translate(82 86) scale(0.116) translate(-250 -250)">
    <circle cx="250" cy="250" r="246" fill="#0B0B0E" />
    <circle cx="250" cy="250" r="240" stroke="#62D4B0" stroke-width="9" stroke-opacity="0.8" />
    <path
      d="M135 145 C 135 375, 195 395, 305 395 C 395 395, 425 345, 425 285 C 425 210, 360 190, 305 190"
      stroke="url(#dw-panel-signal)"
      stroke-width="24"
      stroke-linecap="round"
      fill="none"
    />
    <g transform="translate(10, -8)">
      <rect
        x="195"
        y="172"
        width="200"
        height="160"
        rx="20"
        fill="#15161E"
        stroke="#f2f1ee"
        stroke-width="15"
      />
      <path
        d="M243 224 L268 252 L243 280"
        stroke="#62D4B0"
        stroke-width="19"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
      <rect x="292" y="268" width="60" height="16" rx="8" fill="#62D4B0" />
    </g>
    <circle cx="135" cy="145" r="74" fill="#0B0B0E" />
    <circle cx="135" cy="145" r="64" fill="url(#dw-panel-signal)" />
    <circle cx="135" cy="145" r="25" fill="#FFFFFF" />
  </g>

  <text
    x="82"
    y="176"
    text-anchor="middle"
    font-family="Georgia, Times New Roman, serif"
    font-size="23"
    fill="#F2F1EE"
  >
    DeskWarrant
  </text>

  <text
    x="82"
    y="198"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="10.5"
    font-style="italic"
    fill="#A8A5B0"
  >
    Your PC, on a leash.
  </text>

  <line x1="46" y1="220" x2="118" y2="220" stroke="#62D4B0" stroke-width="1" stroke-opacity="0.45" />

  <text
    x="82"
    y="245"
    text-anchor="middle"
    font-family="Consolas, Courier New, monospace"
    font-size="7.6"
    letter-spacing="1.4"
    fill="#8F8C97"
  >
    WINDOWS HOST AGENT
  </text>

  <text
    x="82"
    y="290"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="8.4"
    fill="#75727C"
  >
    Installs for you only. No admin.
  </text>
</svg>
